      function shuffleArray(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      function assignTeamsToPools(teams, poolSizes) {
        const shuffled = shuffleArray(teams);
        const pools = [];
        let index = 0;
        for (const size of poolSizes) {
          pools.push(shuffled.slice(index, index + size));
          index += size;
        }
        return pools;
      }
      function generateRoundRobinMatches(teams) {
  let teamList = [...teams];

  if (teamList.length % 2 !== 0) {
    teamList.push("BYE");
  }

  const numRounds = teamList.length - 1;
  const half = teamList.length / 2;
  const matches = [];

  for (let round = 0; round < numRounds; round++) {
    for (let i = 0; i < half; i++) {
      const teamA = teamList[i];
      const teamB = teamList[teamList.length - 1 - i];

      if (teamA !== "BYE" && teamB !== "BYE") {
        matches.push([teamA, teamB, round + 1]);
      }
    }

    const fixedTeam = teamList[0];
    const rotatingTeams = teamList.slice(1);
    rotatingTeams.unshift(rotatingTeams.pop());
    teamList = [fixedTeam, ...rotatingTeams];
  }

  return matches;
}

      async function saveMatchesToFirestore(division, pools) {
  if (!division) { console.warn("Skipped saveMatchesToFirestore: division is undefined"); return; }

  // Remove any previously saved matches for this division
  const q = query(collection(db, "matches"), where("division", "==", division));
  const existingMatches = await getDocs(q);
  for (const docSnap of existingMatches.docs) {
    await deleteDoc(docSnap.ref);
  }

  // Read the current number of courts from settings
  const settingsSnap = await getDoc(doc(db, "settings", "tournamentConfig"));
  const numCourts = settingsSnap.exists() ? settingsSnap.data().numCourts : 4;

  // Collect every match from every pool first, tagged with its pool letter
  const allMatches = [];
  for (let i = 0; i < pools.length; i++) {
    const poolLetter = String.fromCharCode(65 + i);
    const matches = generateRoundRobinMatches(pools[i]);
    for (const [teamA, teamB, round] of matches) {
      allMatches.push({ poolLetter, teamA, teamB, round });
    }
  }

  // Group matches by round so courts can rotate fresh within each round
  const matchesByRound = {};
  for (const match of allMatches) {
    if (!matchesByRound[match.round]) matchesByRound[match.round] = [];
    matchesByRound[match.round].push(match);
  }

  // Write each match, assigning courts per round instead of globally
  for (const roundNumber of Object.keys(matchesByRound)) {
    const roundMatches = matchesByRound[roundNumber];
    for (let i = 0; i < roundMatches.length; i++) {
      const { poolLetter, teamA, teamB, round } = roundMatches[i];
      const courtNumber = (i % numCourts) + 1;

      const [sortedA, sortedB] = [teamA.teamName, teamB.teamName].sort();
const matchId = `${division}_${poolLetter}_${sortedA}_vs_${sortedB}`

await setDoc(doc(db, "matches", matchId), {
  division: division,
  poolName: poolLetter,
  round: round,
  teamA: sortedA,
  teamB: sortedB,
  scoreA: null,
  scoreB: null,
  completed: false,
  court: courtNumber
});
        
    }
  }
}

      async function calculateStandings(division, poolLetter, teamNames) {
  if (!division || !poolLetter) {
    console.warn("Skipped calculateStandings: missing field(s)", {division, poolLetter});
    return [];
  }
  const q = query(
    collection(db, "matches"),
    where("division", "==", division),
    where("poolName", "==", poolLetter)
  );
  const snapshot = await getDocs(q);
  const matches = snapshot.docs.map(d => d.data());
  const stats = {};
  teamNames.forEach(name => {
    stats[name] = {team: name, wins: 0, losses: 0, gamesPlayed: 0, pointsFor: 0, pointsAgainst: 0, diff: 0, tied: false};
  });

  matches.forEach(m => {
    if (!m.completed) return;
    if (!stats[m.teamA] || !stats[m.teamB]) {
      console.warn("calculateStandings: match team not in pool, skipped", m.teamA, m.teamB);
      return;
    }
    const a = Number(m.scoreA) || 0;
    const b = Number(m.scoreB) || 0;
    stats[m.teamA].gamesPlayed++;
    stats[m.teamB].gamesPlayed++;
    stats[m.teamA].pointsFor += a;
    stats[m.teamA].pointsAgainst += b;
    stats[m.teamB].pointsFor += b;
    stats[m.teamB].pointsAgainst += a;
    if (a > b) {stats[m.teamA].wins++; stats[m.teamB].losses++;}
    else if (b > a) {stats[m.teamB].wins++; stats[m.teamA].losses++;}
  });

  Object.values(stats).forEach(s => s.diff = s.pointsFor - s.pointsAgainst);

  // Rank by wins, then point differential, then total points scored
  const sorted = Object.values(stats).sort((x, y) =>
    (y.wins - x.wins) || (y.diff - x.diff) || (y.pointsFor - x.pointsFor)
  );

  // Flag teams still tied on all three measures (a playoff game is needed)
  const sameAs = (s, o) => o && o.wins === s.wins && o.diff === s.diff && o.pointsFor === s.pointsFor;
  sorted.forEach((s, i) => {
    s.tied = !!(sameAs(s, sorted[i - 1]) || sameAs(s, sorted[i + 1]));
  });

  return sorted;
}

      async function getAdvancingTeams(division, poolsOfNames) {
  const results = [];
  for (let i = 0; i < poolsOfNames.length; i++) {
    const poolLetter = String.fromCharCode(65 + i);
    const standings = await calculateStandings(division, poolLetter, poolsOfNames[i]);
    results.push({
      pool: poolLetter,
      first: standings[0] ? standings[0].team : "-",
      second: standings[1] ? standings[1].team : "-",
      firstStats: standings[0] || null,
      secondStats: standings[1] || null
    });
  }


  return results;
}

function rankAdvancingTeams(results) {
  const entries = [];
  results.forEach(r => {
    if (r.firstStats) entries.push({ ...r.firstStats, pool: r.pool, place: 1 });
    if (r.secondStats) entries.push({ ...r.secondStats, pool: r.pool, place: 2 });
  });

  entries.forEach(e => {
    const gp = e.gamesPlayed || ((e.wins || 0) + (e.losses || 0));
    e.winPct = gp > 0 ? e.wins / gp : 0;
    e.avgDiff = gp > 0 ? e.diff / gp : 0;
    e.avgPoints = gp > 0 ? e.pointsFor / gp : 0;
    e.crossTie = false;
  });

  entries.sort((a, b) => {
    if (a.place !== b.place) return a.place - b.place;
    if (b.winPct !== a.winPct) return b.winPct - a.winPct;
    if (b.avgDiff !== a.avgDiff) return b.avgDiff - a.avgDiff;
    return b.avgPoints - a.avgPoints;
  });

  for (let i = 0; i < entries.length; i++) {
    const a = entries[i];
    const b = entries[i + 1];
    a.seed = i + 1;
    if (b && a.place === b.place &&
        Math.abs(a.winPct - b.winPct) < 1e-9 &&
        Math.abs(a.avgDiff - b.avgDiff) < 1e-9 &&
        Math.abs(a.avgPoints - b.avgPoints) < 1e-9) {
      a.crossTie = true;
      b.crossTie = true;
    }
  }
  return entries;
}
function buildBracketPairings(entries) {
  if (!entries || entries.length < 4) {
    return { ok: false, reason: "Fewer than four advancing teams." };
  }
  if (entries.slice(0, 5).some(e => e.crossTie)) {
    return { ok: false, reason: "A tie affects the top four or the seed 4/5 cutoff." };
  }

  const top = entries.slice(0, 4);
  const samePool = (pair) => pair[0].pool === pair[1].pool;

  let semi1 = [top[0], top[3]];
  let semi2 = [top[1], top[2]];

  if (samePool(semi1) || samePool(semi2)) {
    const alt1 = [top[0], top[2]];
    const alt2 = [top[1], top[3]];
    if (!samePool(alt1) && !samePool(alt2)) {
      semi1 = alt1;
      semi2 = alt2;
    }
  }

  return {
    ok: true,
    semifinals: [
      { slot: 1, teamA: semi1[0], teamB: semi1[1] },
      { slot: 2, teamA: semi2[0], teamB: semi2[1] }
    ]
  };
}


function bracketMatchId(division, slot) {
  return String(division).replace(/[^a-zA-Z0-9]/g, "_") + "_semi" + slot;
}

async function saveBracketToFirestore(division, pairings) {
  if (!division || !pairings || !pairings.ok) return false;
  for (const semi of pairings.semifinals) {
    await setDoc(doc(db, "bracketMatches", bracketMatchId(division, semi.slot)), {
      division: division,
      round: "semifinal",
      slot: semi.slot,
      teamA: semi.teamA.team,
      teamB: semi.teamB.team,
      poolA: semi.teamA.pool,
      poolB: semi.teamB.pool,
      seedA: semi.teamA.seed,
      seedB: semi.teamB.seed,
      scoreA: null,
      scoreB: null,
      completed: false
    });
  }
  return true;
}

async function saveBracketScore(matchId, scoreA, scoreB) {
  if (!matchId) return;
  await updateDoc(doc(db, "bracketMatches", matchId), { scoreA, scoreB, completed: true });
}

async function deleteBracketFromFirestore(division) {
  if (!division) return;
  for (const slot of [1, 2]) {
    await deleteDoc(doc(db, "bracketMatches", bracketMatchId(division, slot)));
  }
}

async function getMatchScores(division) {
  if (!division) {console.warn("Skipped getMatchScores: division is undefined"); return {};}
  const q = query(collection(db, "matches"), where("division", "==", division));
  const snapshot = await getDocs(q);
  const scores = {};
  snapshot.docs.forEach(d => {
    const data = d.data();
    scores[d.id] = {
      scoreA: data.scoreA || 0,
      scoreB: data.scoreB || 0,
      completed: data.completed || false,
      round: data.round || 1,
      poolName: data.poolName,
      teamA: data.teamA,
      teamB: data.teamB,
      court: data.court || null
    };
  });
  return scores;
}

      async function exportResultsToExcel(divisionLabel, poolsOfNames) {

    alert("The Excel library did not load. Refresh the page and try again.");
    return;
  }

  const savedScores = await getMatchScores(divisionLabel);

  const workbook = new ExcelJS.Workbook();
  const sheet = workbook.addWorksheet("Pool Matches");

  sheet.columns = [
    { header: "Pool", key: "pool", width: 8 },
    { header: "Team A", key: "teamA", width: 28 },
    { header: "Score A", key: "scoreA", width: 10 },
    { header: "Team B", key: "teamB", width: 28 },
    { header: "Score B", key: "scoreB", width: 10 },
    { header: "Status", key: "status", width: 14 }
  ];
  sheet.getRow(1).font = { bold: true };

  poolsOfNames.forEach((poolNames, i) => {
    const poolLetter = String.fromCharCode(65 + i);
    for (let a = 0; a < poolNames.length; a++) {
      for (let b = a + 1; b < poolNames.length; b++) {
        const [sortedA, sortedB] = [poolNames[a], poolNames[b]].sort();
        const matchId = `${divisionLabel}_${poolLetter}_${sortedA}_vs_${sortedB}`.replace(/[^a-zA-Z0-9]/g, "_");
        const existing = savedScores[matchId] && savedScores[matchId].completed ? savedScores[matchId] : null;
        const scoreA = existing && existing.scoreA != null ? existing.scoreA : "";
        const scoreB = existing && existing.scoreB != null ? existing.scoreB : "";
        const played = scoreA !== "" && scoreB !== "";
        sheet.addRow({
          pool: poolLetter,
          teamA: sortedA,
          scoreA: scoreA,
          teamB: sortedB,
          scoreB: scoreB,
          status: played ? "Complete" : "Not played"
        });
      }
    }
  });

    const standingsSheet = workbook.addWorksheet("Standings");
  standingsSheet.columns = [
    { header: "Pool", key: "pool", width: 8 },
    { header: "Rank", key: "rank", width: 8 },
    { header: "Team", key: "team", width: 28 },
    { header: "Games Played", key: "gp", width: 14 },
    { header: "Wins", key: "wins", width: 8 },
    { header: "Losses", key: "losses", width: 8 },
    { header: "Points For", key: "pf", width: 12 },
    { header: "Points Against", key: "pa", width: 14 },
    { header: "Differential", key: "diff", width: 12 },
    { header: "Tie Flag", key: "tied", width: 24 }
  ];
  standingsSheet.getRow(1).font = { bold: true };

  for (let i = 0; i < poolsOfNames.length; i++) {
    const poolLetter = String.fromCharCode(65 + i);
    const standings = await calculateStandings(divisionLabel, poolLetter, poolsOfNames[i]);
    standings.forEach((s, index) => {
      standingsSheet.addRow({
        pool: poolLetter,
        rank: index + 1,
        team: s.team,
        gp: s.gamesPlayed,
        wins: s.wins,
        losses: s.losses,
        pf: s.pointsFor,
        pa: s.pointsAgainst,
        diff: s.diff,
        tied: s.tied ? "Tied - playoff needed" : ""
      });
    });
  }

  const buffer = await workbook.xlsx.writeBuffer();
  const blob = new Blob([buffer], {
    type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
  });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = `${divisionLabel.replace(/[^a-zA-Z0-9]/g, "_")}_Results.xlsx`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
}

async function checkPoolCompletion(divisionLabel, poolsOfNames) {
  const savedScores = await getMatchScores(divisionLabel);
  const results = [];

  poolsOfNames.forEach((poolNames, i) => {
    const poolLetter = String.fromCharCode(65 + i);
    let allComplete = true;

    for (let a = 0; a < poolNames.length; a++) {
      for (let b = a + 1; b < poolNames.length; b++) {
        const [sortedA, sortedB] = [poolNames[a], poolNames[b]].sort();
        const matchId = `${divisionLabel}_${poolLetter}_${sortedA}_vs_${sortedB}`.replace(/[^a-zA-Z0-9]/g, "_");
        const existing = savedScores[matchId];
        if (!existing || !existing.completed) allComplete = false;
      }
    }

    console.log(`Pool ${poolLetter} (${divisionLabel}) complete: ${allComplete}`);
    results.push({ poolLetter, complete: allComplete });
  });

  const allPoolsComplete = results.every(r => r.complete);
  console.log(`All pools complete for ${divisionLabel}: ${allPoolsComplete}`);
  return results;
}

    function calculatePools(totalTeams, minGames) {
      const minPoolSize = minGames + 1;

      let numPools = Math.floor(totalTeams / minPoolSize);
      if (numPools < 1) numPools = 1;

      const basePoolSize = Math.floor(totalTeams / numPools);
      const extraTeams = totalTeams % numPools;

      const pools = [];
      for (let i = 0; i < numPools; i++) {
        const size = i < extraTeams ? basePoolSize + 1 : basePoolSize;
        pools.push(size);
      }

      return pools;
    }
